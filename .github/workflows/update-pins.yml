# PLAN §6: "apps we package get stale silently" is a risk, so freshness is a
# scheduled job rather than a habit. The update itself needs no Nix build — it is
# one GitHub API call plus one SHA256SUMS.txt download per product — so this is
# cheap enough to run weekly and to open a PR only when a pin actually moved.
name: release pins freshness

on:
  schedule:
    # Monday 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: cachix/install-nix-action@V31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # --all so a product that is packageable but somehow unpinned also shows up.
      # --dry-run --fail-on-change: report the diff, exit non-zero if it is not empty.
      - name: check for new upstream releases
        run: nix run .#update -- --all --dry-run --fail-on-change

      # If we got here nothing moved, unless the previous step was run without the
      # fail flag. Bump on a separate manual dispatch when a PR is wanted.
      - name: open a bump PR
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          nix run .#update -- --all
          if git diff --quiet -- pins.lock.json; then
            echo "pins.lock.json unchanged; nothing to open"
            exit 0
          fi
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          branch="craft/update-pins-$(date -u +%Y%m%d)"
          git checkout -b "$branch"
          git add pins.lock.json
          git commit -m "craft: update release pins"
          git push -u origin "$branch"
          echo "opened branch $branch; create the PR from the repository page"
