# Every check the flake has — CI cannot run these on a fork without a nixpkgs
# cache, so keep the payload honest: it fetches ~1.5 GB of upstream Craft
# tarballs on a cold store.
name: flake check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      # Pinned to full commit SHAs: `@v4`/`@V31`-style refs are exactly what broke
      # the first run (GitHub cannot resolve a tag that does not exist). Resolve a
      # new SHA with
      #   curl -s https://api.github.com/repos/<owner>/<repo>/git/ref/tags/<tag> | jq -r .object.sha
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Eval-only first: products.nix vs pins.lock.json vs the builder, across
      # x86_64/aarch64/riscv64, no downloads.
      - name: prebuilt eval
        run: nix build --no-link .#checks.x86_64-linux.prebuilt-eval

      # Formatting is cheap and fails loudly.
      - name: nixfmt
        run: nix build --no-link .#checks.x86_64-linux.nixfmt

      # Builds every published app, runs the <app>-cli --version smoke tests and
      # the upstream desktop/metainfo validation, and evaluates the NixOS module.
      - name: flake check
        run: nix flake check -L
